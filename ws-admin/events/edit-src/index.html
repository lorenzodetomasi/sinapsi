<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      QUESTA pagina non si tiene in cache. È il guscio dell'editor: dentro non c'è
      niente, solo il rimando al programma, e il nome di quel file cambia a ogni
      rilascio (porta l'impronta del contenuto). Se il browser si tiene il guscio
      vecchio, quel rimando punta a un file che sul server non c'è più: l'editor non
      parte e si vede un modulo con tutti i campi vuoti — che è esattamente quello
      che succedeva, e che si «risolveva» svuotando la cache.
      Il programma e gli stili invece restano in cache quanto vogliono: cambiando
      nome a ogni rilascio, una copia vecchia non viene più chiesta da nessuno.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Form Editor PoC — JSON Forms + JSON-LD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Source+Code+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Il foglio dei MODULI arriva dal tema, non dal bundle: e' lo stesso file che
      un giorno vestira' un modulo pubblicato sul sito, e due copie dello stesso
      foglio divergono al primo ritocco.
      Il percorso e' assoluto dalla radice del sito apposta: scritto relativo,
      la build lo inglobava fra i propri asset — cioe' ne faceva una copia, che
      e' esattamente la cosa da non fare. Un indirizzo assoluto Vite lo lascia
      stare, e resta un rimando a QUEL file.
    -->
    <link rel="stylesheet" href="/ws-custom/themes/meetoo/form.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
