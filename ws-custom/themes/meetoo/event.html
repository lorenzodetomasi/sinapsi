<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evento — Meetoo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="meetoo.css" />
  <style>
    /* La cover 16:9 con sfumatura e il cuore stanno in meetoo.css: li usa anche
       la pagina della collezione. Qui restano solo le specificità dell evento. */
    * { box-sizing: border-box; }
    .crumbs { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
    .crumb .material-symbols-outlined { font-size: 1.1rem; }

    .ev-title { font-family: var(--font-family1); font-weight: 700; font-size: 1.8rem; color: var(--color1); margin: 0 0 4px; }

    .meta { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; color: var(--color-text); }
    .meta .row { display: inline-flex; align-items: center; gap: 8px; }
    .meta .material-symbols-outlined { font-size: 1.2rem; color: var(--color-link); }
    .meta .hint { color: var(--color-hint); }

    .ev-image { width: 100%; max-height: 340px; object-fit: cover; border-radius: var(--border-radius); margin: 14px 0; background: var(--color-background-section2); }
    .desc { margin: 16px 0; }
    .desc :first-child { margin-top: 0; } .desc :last-child { margin-bottom: 0; }

    .prog { display: flex; flex-direction: column; gap: 10px; }
    .prog-item { display: flex; gap: 12px; background: var(--color-background-section1); border: 1px solid var(--color-line); border-radius: var(--border-radius); padding: 10px 12px; }
    .prog-time { flex: 0 0 auto; font-family: var(--font-family1); font-weight: 700; color: var(--color-link); min-width: 44px; }
    .prog-name { font-weight: 600; }
    .prog-desc { color: var(--color-hint); font-size: .9rem; }

    /* Chi organizza: sta nelle informazioni, quindi va a capo con esse. */
    .meta .org-row { flex-wrap: wrap; gap: 6px; }
    .meta .org-row > span:first-child { color: var(--color-hint); }
    /* Il luogo è cliccabile: apre la sua scheda. */
    .place-link { color: var(--color-link); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
    .place-link:hover { border-bottom-style: solid; }

    /* Scheda del luogo: stesse classi del modale condiviso (.mt-*), più le righe
       di contenuto del lungomare. */
    .modal-sub { color: var(--color-hint); font-size: .9rem; text-transform: uppercase; letter-spacing: .04em; margin: -8px 0 12px; }
    .modal-desc { margin: 10px 0; }
    .modal-line { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--color-text); flex-wrap: wrap; }
    .modal-line .material-symbols-outlined { font-size: 1.1rem; color: var(--color-link); }
    .modal-amen { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .modal-amen .amenity { background: var(--color-background-section2); border-radius: 999px; padding: 3px 10px; font-size: .85rem; color: var(--color-hint); }
    .modal-img { width: 100%; border-radius: var(--border-radius); margin: 12px 0; display: block; }

    .orgs { display: flex; flex-wrap: wrap; gap: 8px; }
    .org-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--color-background-section2); border: 1px solid var(--color-line); border-radius: 999px; padding: 4px 12px; text-decoration: none; color: var(--color-text); font-size: .9rem; }
    .org-chip .material-symbols-outlined { font-size: 1rem; color: var(--color-link); }

    /* Registrazione (RSVP) */
    .rsvp-box { border: 1px solid var(--color-line); border-radius: var(--border-radius); background: var(--color-background-section1); padding: 14px 16px; margin: 18px 0; }
    .rsvp-title { font-family: var(--font-family1); font-weight: 700; color: var(--color1); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }
    .rsvp-title .material-symbols-outlined { color: var(--color1); }
    .rsvp-cap { color: var(--color-hint); font-size: .9rem; margin-bottom: 10px; }
    .rsvp-cap b { color: var(--color-text); }
    .rsvp-modes { display: flex; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
    .rsvp-modes label { display: inline-flex; align-items: center; gap: 5px; color: var(--color-text); font-size: .92rem; cursor: pointer; }
    .rsvp-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .rsvp-btn { background: var(--color-link); color: light-dark(#fff, #0b1020); border: none; border-radius: 999px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .rsvp-btn:disabled { opacity: .5; cursor: not-allowed; }
    .rsvp-btn.ghost { background: var(--color-background-section2); color: var(--color-link); border: 1px solid var(--color-line); }
    .rsvp-registered { color: var(--color-link); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .rsvp-err { color: var(--color-danger); font-size: .88rem; margin-top: 8px; }
    .rsvp-full { color: var(--color-danger); font-weight: 600; }
    .admin-box { border-top: 1px dashed var(--color-line); margin-top: 14px; padding-top: 12px; }
    .admin-box h3 { font-family: var(--font-family1); font-size: 1rem; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
    .badge-new { background: var(--color1); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: .72rem; font-weight: 700; }
    .part-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
    .part { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; background: var(--color-background-section2); border-radius: 8px; font-size: .9rem; }
    .part .pm { color: var(--color-hint); }
    .notify-row { display: inline-flex; align-items: center; gap: 6px; color: var(--color-hint); font-size: .9rem; margin-top: 8px; cursor: pointer; }
  
  </style>
</head>
<body>
  <div class="wrap" id="wrap"><div class="state">Carico l'evento…</div></div>

  <!-- Moduli condivisi: template delle card + header (prima dello script di pagina). -->
  <script src="cards.js"></script>
  <script src="header.js"></script>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const id = (params.get('id') || params.get('event') || '').replace(/^\/+|\/+$/g, '');
    // Dove stanno i contenuti lo dice l'header condiviso: dichiarato con un <meta>
    // se c'è, altrimenti dedotto. Prima ogni pagina se lo ricavava per conto suo,
    // con un ripiego su '/sinapsi/…' che sarebbe scattato proprio al trasloco.
    const CONTENT_BASE = Meetoo.contentBase();
    const BASE_Q = params.get('base') ? '&base=' + encodeURIComponent(params.get('base')) : '';
    const wrap = document.getElementById('wrap');
    const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

    if (!id) { wrap.innerHTML = '<div class="state err">Evento non indicato. Aggiungi <code>?id=events/&lt;slug&gt;</code> all\'URL.</div>'; return; }

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const refName = (o) => !o ? '' : (typeof o === 'string' ? o.split('/').pop() : (o.name || String(o['@id'] || '').split('/').pop()));
    const refKey  = (o) => { const r = typeof o === 'string' ? o : (o && o['@id']) || ''; return r.split('/').pop(); };
    const timeOf = (d) => { const t = new Date(d); return !isNaN(t) && /T\d/.test(d) ? t.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : ''; };

    // Badge di stato: template condiviso (cards.js).
    const statusBadge = (s) => Meetoo.cardUtils.statusBadge(s);
    function whenText(sd, ed) {
      const s = sd ? new Date(sd) : null; if (!s || isNaN(s)) return '';
      const d = `${s.getDate()} ${MESI[s.getMonth()]} ${s.getFullYear()}`;
      const t1 = timeOf(sd), t2 = timeOf(ed);
      return d + (t1 ? ` · ${t1}${t2 ? '–' + t2 : ''}` : '');
    }
    // Un'immagine può essere: un URL esterno, un percorso DALLA RADICE dei contenuti
    // (events/<altro>/media/x.jpg — è così che si riusa la stessa cover senza copiarla)
    // oppure un percorso relativo alla cartella dell'evento (media/x.jpg).
    const asMedia = (rel) => {
      if (!rel) return '';
      if (/^https?:\/\//i.test(rel)) return rel;
      if (/^(events|places|organizations)\//.test(rel)) return CONTENT_BASE + rel;
      return CONTENT_BASE + id + '/' + rel;
    };

    // "25 agosto 2026" — l'ora si aggiunge solo quando serve a distinguere.
    const dateLabel = (sd, withTime) => {
      const s = sd ? new Date(sd) : null;
      if (!s || isNaN(s)) return '';
      const d = `${s.getDate()} ${MESI[s.getMonth()]} ${s.getFullYear()}`;
      const t = withTime ? timeOf(sd) : '';
      return t ? `${d}, ${t}` : d;
    };
    const getJson = (url) => fetch(url, { headers: { Accept: 'application/json' } })
      .then((r) => { const ct = r.headers.get('content-type') || ''; return (r.ok && ct.includes('json')) ? r.json() : null; })
      .catch(() => null);

    // Completa il breadcrumb: il nome vero della collezione (il riferimento è spesso
    // il solo percorso) e l'ora, ma solo se un'altra occorrenza cade lo stesso giorno.
    function refineBreadcrumb(d, superRef, orgs) {
      const key = superRef.split('/').pop();
      Promise.all([
        getJson(CONTENT_BASE + superRef + '/index.json'),
        getJson(CONTENT_BASE + 'events/_index/by-collection/' + key + '.json'),
        getJson(CONTENT_BASE + 'events/_index/by-collection/' + key + '.archive.json'),
      ]).then(([serieDoc, prossimi, archivio]) => {
        const se = serieDoc && (serieDoc.mainEntity || serieDoc);
        const nome = (se && se.name) || refName(d.superEvent) || 'Collezione';
        // Stesso giorno, occorrenze diverse → l'ora diventa necessaria.
        const giorno = (x) => String(x || '').slice(0, 10);
        const sorelle = [].concat(prossimi || [], archivio || [])
          .filter((e) => e && giorno(e.startDate) === giorno(d.startDate) && e.path !== id);
        const bc = [];
        if (orgs[0]) bc.push({ label: refName(orgs[0]), href: 'organizer.html?org=' + encodeURIComponent(refKey(orgs[0])) + BASE_Q, title: 'Vai all\'organizzatore' });
        bc.push({ label: nome, href: 'collection.html?id=' + encodeURIComponent(superRef) + BASE_Q, title: 'Vai alla collezione' });
        bc.push({ label: dateLabel(d.startDate, sorelle.length > 0) || d.name, current: true });
        if (window.Meetoo) Meetoo.setBreadcrumb(bc);
      });
    }

    /* ---------- «Mi interessa» ----------
     * Il conteggio è pubblico e si legge senza login; per metterlo o toglierlo
     * serve essere loggati (il like resta anche sul profilo, così «gli eventi che
     * mi interessano» è una domanda con risposta). */
    const likeHtml = () =>
      '<button class="like-btn" id="like-btn" type="button" title="Mi interessa" aria-pressed="false">' +
      '<span class="material-symbols-outlined">favorite</span></button>' +
      '<span class="like-count" id="like-count"></span>';

    function paintLike(liked, n) {
      const b = document.getElementById('like-btn'), c = document.getElementById('like-count');
      if (!b) return;
      b.classList.toggle('on', !!liked);
      b.setAttribute('aria-pressed', liked ? 'true' : 'false');
      b.title = liked ? 'Non mi interessa più' : 'Mi interessa';
      if (c) c.textContent = n > 0 ? n : '';
    }

    function setupLike() {
      const b = document.getElementById('like-btn');
      if (!b) return;
      // Conteggio subito, senza login: il file è pubblico.
      getJson(CONTENT_BASE + id + '/likes.json').then((j) => paintLike(false, (j && j.count) || 0));
      const S = window.meetooSession;
      if (S) S.subscribe(() => {
        S.api('status', { path: id }).then((r) => {
          if (r.status === 200 && r.body) paintLike(r.body.liked, r.body.likes || 0);
        });
      });
      b.addEventListener('click', () => {
        const S2 = window.meetooSession;
        if (!S2 || !S2.getUser()) { alert('Accedi con Google (in alto a destra) per segnalare il tuo interesse.'); return; }
        b.disabled = true;
        S2.api('like', { path: id }).then((r) => {
          b.disabled = false;
          if (r.status === 200 && r.body && r.body.success) paintLike(r.body.liked, r.body.likes);
        });
      });
    }

    // Nessuna immagine propria: si prova quella della serie, così un'occorrenza
    // eredita la locandina della rassegna senza doverla ricaricare.
    function coverFromSeries(d) {
      const superRef = typeof d.superEvent === 'string' ? d.superEvent : (d.superEvent && d.superEvent['@id']);
      if (!superRef) return;
      getJson(CONTENT_BASE + superRef + '/index.json').then((doc) => {
        const s = doc && (doc.mainEntity || doc);
        const img = s && (s.image || s.logo);
        const rel = typeof img === 'string' ? img : (img && (img.url || img['@id']));
        if (!rel) return;
        const src = /^https?:\/\//i.test(rel) ? rel
          : (/^(events|places|organizations)\//.test(rel) ? CONTENT_BASE + rel : CONTENT_BASE + superRef + '/' + rel);
        const row = document.querySelector('.like-row');
        const html = '<div class="cover"><img src="' + esc(src) + '" alt="" onerror="this.closest(\'.cover\').remove()">' +
          '<div class="cover-foot"><span></span><span class="cover-actions">' + likeHtml() + '</span></div></div>';
        document.querySelector('.ev-title').insertAdjacentHTML('afterend', html);
        if (row) row.remove();
        setupLike();
      });
    }

    // Scheda del luogo in sovrimpressione, con lo stesso modale del lungomare
    // (classi .mt-* condivise, le stesse delle Impostazioni nell'header).
    function openPlaceModal(ref) {
      let ov = document.getElementById('place-ov');
      if (!ov) {
        ov = document.createElement('div');
        ov.className = 'mt-ov'; ov.id = 'place-ov';
        ov.innerHTML = '<div class="mt-modal" role="dialog" aria-modal="true">' +
          '<button class="mt-modal-close" title="Chiudi"><span class="material-symbols-outlined">close</span></button>' +
          '<div class="mt-modal-scroll" id="place-ov-body"></div></div>';
        document.body.appendChild(ov);
        const close = () => ov.classList.remove('open');
        ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
        ov.querySelector('.mt-modal-close').onclick = close;
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      }
      const body = document.getElementById('place-ov-body');
      body.innerHTML = '<div class="state">Carico il luogo…</div>';
      ov.classList.add('open');

      const path = typeof ref === 'string' ? ref : (ref && ref['@id']) || '';
      getJson(CONTENT_BASE + String(path).replace(/^\/+/, '') + '/index.json').then((doc) => {
        const p = doc && (doc.mainEntity || doc);
        if (!p) { body.innerHTML = '<div class="state err">Dettagli non disponibili per questo luogo.</div>'; return; }
        const a = p.address || {};
        const addr = a.streetAddress ? (a.streetAddress + (a.addressLocality ? ', ' + a.addressLocality : '')) : (a.addressLocality || '');
        const tipi = [].concat(p['@type'] || []).filter((t) => t && t !== 'Place');
        const rv = p.aggregateRating && p.aggregateRating.ratingValue;
        const rc = p.aggregateRating && (p.aggregateRating.reviewCount || p.aggregateRating.ratingCount);
        const geo = p.geo || {};
        const mappa = (typeof p.hasMap === 'string' ? p.hasMap : (p.hasMap && p.hasMap.url))
          || (Array.isArray(p.hasMap) && p.hasMap[0] && p.hasMap[0].url)
          || (geo.latitude ? 'https://www.google.com/maps/search/?api=1&query=' + geo.latitude + ',' + geo.longitude : '');
        const amen = (Array.isArray(p.amenityFeature) ? p.amenityFeature : []).filter((x) => x && x.name);
        const sat = p['meetoo:satelliteView'] ? CONTENT_BASE + path + '/' + p['meetoo:satelliteView'] : '';

        body.innerHTML =
          '<h2 class="mt-modal-title">' + esc(p.name || path.split('/').pop()) + '</h2>' +
          (tipi.length ? '<div class="modal-sub">' + esc(tipi.join(' · ')) + '</div>' : '') +
          (rv ? '<div class="modal-line"><span class="material-symbols-outlined">star</span>' + esc(rv) + (rc ? ' (' + esc(rc) + ' recensioni)' : '') + '</div>' : '') +
          (p.description ? '<p class="modal-desc">' + esc(p.description) + '</p>' : '') +
          (addr ? '<div class="modal-line"><span class="material-symbols-outlined">place</span>' + esc(addr) + '</div>' : '') +
          (p.url ? '<div class="modal-line"><span class="material-symbols-outlined">link</span><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(String(p.url).replace(/^https?:\/\//, '')) + '</a></div>' : '') +
          (amen.length ? '<div class="modal-amen">' + amen.map((x) => '<span class="amenity">' + esc(x.name) + '</span>').join('') + '</div>' : '') +
          (sat ? '<img class="modal-img" src="' + esc(sat) + '" alt="" onerror="this.style.display=\'none\'">' : '') +
          (mappa ? '<div class="modal-line"><a class="card-act" href="' + esc(mappa) + '" target="_blank" rel="noopener"><span class="material-symbols-outlined">map</span>Apri in mappa</a></div>' : '');
      });
    }

    // Riquadro di registrazione (RSVP) + sezione admin partecipanti. Usa window.meetooSession
    // (session.js) per login e chiamate a rsvp.php. Solo per gli eventi singoli.
    function setupRsvp(evId, isSeries) {
      if (isSeries) return;
      const S = window.meetooSession;
      if (!S) { setTimeout(() => setupRsvp(evId, isSeries), 120); return; } // attende session.js
      const box = document.getElementById('rsvp');
      if (!box) return;
      let st = null, err = '';
      const modeLabel = (m) => m === 'online' ? 'da remoto' : 'in presenza';
      const fmtDate = (d) => { const t = new Date(d); return isNaN(t) ? '' : t.toLocaleDateString('it-IT'); };

      function render() {
        const u = S.getUser();
        const cap = (st && st.capacity) || {};
        const rem = cap.remaining;
        let capLine;
        if (rem === null || rem === undefined) capLine = 'Posti non specificati.';
        else {
          capLine = 'Posti rimasti: <b>' + rem + '</b>' + (cap.maxTotal ? ' di ' + cap.maxTotal : '');
          if (cap.offlineAllowed && cap.onlineAllowed)
            capLine += ' · in presenza ' + Math.max(0, cap.maxPhysical - cap.offlineCount) + ' · da remoto ' + Math.max(0, cap.maxVirtual - cap.onlineCount);
        }
        let h = '<h2 class="rsvp-title"><span class="material-symbols-outlined">how_to_reg</span>Partecipa</h2>' +
                '<div class="rsvp-cap">' + capLine + '</div>';

        if (!u) {
          h += '<div class="rsvp-cap">Accedi con Google (in alto a destra) per registrarti.</div>';
        } else if (st && st.registered) {
          h += '<div class="rsvp-actions"><span class="rsvp-registered"><span class="material-symbols-outlined">check_circle</span>Sei registrato (' + modeLabel(st.myMode) + ')</span>' +
               '<button class="rsvp-btn ghost" data-act="unregister">Annulla</button>';
          if (cap.offlineAllowed && cap.onlineAllowed) {
            const other = st.myMode === 'online' ? 'offline' : 'online';
            h += '<button class="rsvp-btn ghost" data-act="switch" data-mode="' + other + '">Passa a ' + modeLabel(other) + '</button>';
          }
          h += '</div>';
        } else if (cap.full) {
          h += '<div class="rsvp-full">Posti esauriti.</div>';
        } else {
          let modes = '';
          if (cap.offlineAllowed && cap.onlineAllowed) {
            modes = '<div class="rsvp-modes">' +
              '<label><input type="radio" name="mt-mode" value="offline"' + (cap.offlineFull ? ' disabled' : ' checked') + '>In presenza' + (cap.offlineFull ? ' (esauriti)' : '') + '</label>' +
              '<label><input type="radio" name="mt-mode" value="online"' + (cap.onlineFull ? ' disabled' : (cap.offlineFull ? ' checked' : '')) + '>Da remoto' + (cap.onlineFull ? ' (esauriti)' : '') + '</label></div>';
          }
          const only = (cap.onlineAllowed && !cap.offlineAllowed) ? 'online' : 'offline';
          h += modes + '<div class="rsvp-actions"><button class="rsvp-btn" data-act="register" data-only="' + only + '">Registrati</button></div>';
        }
        if (err) h += '<div class="rsvp-err">' + esc(err) + '</div>';
        if (st && st.isAdmin) h += '<div class="admin-box" id="adminBox"><button class="rsvp-btn ghost" data-act="participants">Vedi partecipanti (' + (st.count || 0) + ')</button></div>';

        box.className = 'rsvp-box';
        box.innerHTML = h;
        box.querySelectorAll('[data-act]').forEach((el) => {
          el.onclick = () => {
            const a = el.dataset.act;
            if (a === 'register') { const s = box.querySelector('input[name=mt-mode]:checked'); call('register', { mode: s ? s.value : el.dataset.only }); }
            else if (a === 'switch') call('register', { mode: el.dataset.mode });
            else if (a === 'unregister') call('unregister', {});
            else if (a === 'participants') loadParticipants();
          };
        });
      }

      function call(action, extra) {
        err = '';
        S.api(action, Object.assign({ path: evId }, extra)).then((r) => {
          if (r.status === 200 && r.body && r.body.success !== false) load();
          else { err = (r.body && r.body.error) || ('Errore ' + r.status); render(); }
        });
      }

      function loadParticipants() {
        S.api('participants', { path: evId }).then((r) => {
          if (r.status !== 200 || !r.body || !r.body.success) return;
          const p = r.body;
          const rows = p.participants.map((x) => '<div class="part"><span>' + esc(x.name || x.email) + '</span><span class="pm">' + modeLabel(x.mode) + ' · ' + fmtDate(x.date) + '</span></div>').join('')
            || '<div class="rsvp-cap">Ancora nessun partecipante.</div>';
          const admin = document.getElementById('adminBox');
          admin.innerHTML = '<h3><span class="material-symbols-outlined">groups</span>Partecipanti (' + p.count + ')' +
            (p.newCount ? ' <span class="badge-new">' + p.newCount + ' nuove</span>' : '') + '</h3>' +
            '<div class="part-list">' + rows + '</div>' +
            '<label class="notify-row"><input type="checkbox" id="notifyChk"' + (p.notifyEnabled ? ' checked' : '') + '> Notificami le nuove registrazioni</label>';
          const chk = document.getElementById('notifyChk');
          chk.onchange = () => S.api('notify', { path: evId, enabled: chk.checked ? '1' : '0' });
        });
      }

      function load() { S.api('status', { path: evId }).then((r) => { st = r.body; render(); }); }
      S.subscribe(() => load()); // carica ora e a ogni cambio di login
    }

    fetch(CONTENT_BASE + id + '/index.json', { headers: { Accept: 'application/json' } })
      .then((r) => { const ct = r.headers.get('content-type') || ''; return (r.ok && ct.includes('json')) ? r.json() : Promise.reject(r.status); })
      .then((doc) => {
        const d = doc && doc.mainEntity ? doc.mainEntity : doc;
        document.title = (d.name || 'Evento') + ' — Meetoo';

        // Breadcrumb: organizzatore › collezione › QUANDO. In una collezione il
        // titolo si ripete a ogni occorrenza, quindi a distinguerla è la data;
        // l'ora si aggiunge solo se un'altra occorrenza cade lo stesso giorno.
        const orgs = Array.isArray(d.organizer) ? d.organizer : (d.organizer ? [d.organizer] : []);
        const superRef = typeof d.superEvent === 'string' ? d.superEvent : (d.superEvent && d.superEvent['@id']);
        const bc = [];
        if (orgs[0]) bc.push({ label: refName(orgs[0]), href: 'organizer.html?org=' + encodeURIComponent(refKey(orgs[0])) + BASE_Q, title: 'Vai all\'organizzatore' });
        if (superRef) bc.push({ label: refName(d.superEvent) || 'Collezione', id: 'bc-series', href: 'collection.html?id=' + encodeURIComponent(superRef) + BASE_Q, title: 'Vai alla collezione' });
        bc.push({ label: dateLabel(d.startDate) || d.name || 'Evento', current: true });
        if (window.Meetoo) Meetoo.setBreadcrumb(bc);
        // Il nome della collezione e l'eventuale ora arrivano dopo (una lettura
        // ciascuno): il breadcrumb si completa senza far aspettare la pagina.
        if (superRef) refineBreadcrumb(d, superRef, orgs);

        // Meta: quando, dove, prezzo, chi organizza
        const meta = [];
        const when = whenText(d.startDate, d.endDate);
        if (when) meta.push('<div class="row"><span class="material-symbols-outlined">event</span><span>' + esc(when) + '</span></div>');
        // Luogo: subito il nome scritto nell'evento, poi "Nome, Località" appena
        // risolto il file del luogo (stessa regola dell'indice — vedi cards.js).
        // È un link: apre la scheda del luogo in sovrimpressione.
        if (d.location) meta.push('<div class="row"><span class="material-symbols-outlined">location_on</span>' +
          '<a href="#" id="ev-place" class="place-link" title="Informazioni sul luogo">' + esc(refName(d.location)) + '</a></div>');
        const free = d.isAccessibleForFree === true || d.isAccessibleForFree === 'true';
        const price = d.offers && (d.offers.price !== undefined) ? Number(d.offers.price) : null;
        if (free || price === 0) meta.push('<div class="row"><span class="material-symbols-outlined">sell</span><span>Ingresso libero</span></div>');
        else if (price) meta.push('<div class="row"><span class="material-symbols-outlined">sell</span><span>' + esc(price) + ' ' + esc((d.offers && d.offers.priceCurrency) || 'EUR') + '</span></div>');
        // Chi organizza: sta fra le informazioni dell'evento, non in una sezione a parte.
        if (orgs.length) meta.push('<div class="row org-row"><span>Evento organizzato da</span>' +
          orgs.map((o) => '<a class="org-chip" href="organizer.html?org=' + esc(encodeURIComponent(refKey(o))) + BASE_Q + '">' +
            '<span class="material-symbols-outlined">' + esc(Meetoo.orgIcon(o && o['@type'], refName(o))) + '</span>' + esc(refName(o)) + '</a>').join('') +
          '</div>');

        // Programma (subEvent inline: quelli senza @id)
        const prog = (Array.isArray(d.subEvent) ? d.subEvent : []).filter((s) => s && !s['@id'] && (s.name || s.startDate));
        const progHtml = prog.length ? (
          '<section><h2 class="sec-head"><span class="material-symbols-outlined">list_alt</span>Programma</h2><div class="prog">' +
          prog.map((s) => '<div class="prog-item"><div class="prog-time">' + esc(timeOf(s.startDate) || '·') + '</div><div><div class="prog-name">' + esc(s.name || '') + '</div>' + (s.description ? '<div class="prog-desc">' + esc(s.description) + '</div>' : '') + '</div></div>').join('') +
          '</div></section>') : '';

        // Cover: l'immagine dell'evento o, se non ce l'ha, quella della serie
        // (la locandina della rassegna vale per tutte le sue date).
        const cover = asMedia(d.image || d.logo);
        // Se l'immagine dichiarata non carica (percorso sbagliato, file mai
        // caricato) non basta togliere il riquadro: si prova comunque la serie,
        // altrimenti un riferimento rotto è peggio che nessun riferimento.
        const coverHtml = cover
          ? '<div class="cover"><img src="' + esc(cover) + '" alt="" onerror="this.closest(\'.cover\').remove(); window.__coverFallback && window.__coverFallback();">' +
            '<div class="cover-foot">' +
              (d['meetoo:imageCredit'] ? '<span class="cover-credit">' + esc(d['meetoo:imageCredit']) + '</span>' : '<span></span>') +
              '<span class="cover-actions">' + likeHtml() + '</span>' +
            '</div></div>'
          : '';
        // Registrazione in fondo: è l'invito ad agire, e si legge dopo aver saputo
        // di che si tratta (descrizione e programma).
        wrap.innerHTML =
          '<h1 class="ev-title">' + esc(d.name || 'Evento') + statusBadge(d.eventStatus) + '</h1>' +
          coverHtml +
          (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') +
          (cover ? '' : '<div class="like-row">' + likeHtml() + '</div>') +
          (d.description ? '<div class="desc">' + d.description + '</div>' : '') +  // rich-text XHTML
          progHtml +
          '<div id="rsvp"></div>';
        setupLike();
        // Il ripiego serve in due casi: nessuna immagine dichiarata, oppure una
        // dichiarata che non si carica (vedi onerror qui sopra). Una volta sola.
        let ripiegato = false;
        window.__coverFallback = () => { if (!ripiegato) { ripiegato = true; coverFromSeries(d); } };
        if (!cover) window.__coverFallback();

        // Completa il luogo con la località (il riferimento nell'evento non ce l'ha)
        // e apre la sua scheda al clic.
        if (d.location) {
          const el = document.getElementById('ev-place');
          if (el) el.addEventListener('click', (e) => { e.preventDefault(); openPlaceModal(d.location); });
          Meetoo.resolvePlace(CONTENT_BASE, d.location).then((p) => {
            const txt = Meetoo.placeText(p);
            if (el && txt) el.textContent = txt;
          });
        }

        // Registrazione (solo eventi singoli): riquadro capienze + admin partecipanti.
        setupRsvp(id, Array.isArray(d['@type']) ? d['@type'].indexOf('EventSeries') !== -1 : d['@type'] === 'EventSeries');
      })
      .catch((status) => {
        wrap.innerHTML = '<div class="state err">Evento non disponibile (' + esc(status) + '). Verifica l\'id o rigenera l\'indice.</div>';
      });
  })();
  </script>
</body>
</html>
