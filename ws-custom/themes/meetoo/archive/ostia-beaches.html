            margin: 0;
            padding: 20px;
        }
        .container {

            margin-bottom: 30px;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            padding: 15px;

        }
        .legend-item {

        }

            font-weight: 600;

        .node-label:hover {

function drawSubwayMap() {
    const container = document.getElementById('subway-map-container');
    const svgNS = "http://www.w3.org/2000/svg";
    
    const nodeGap = 55; 
    const startY = 40;
    const svgHeight = (ostiaData.length * nodeGap) + (startY * 2);
    const svgWidth = 650;
    const xPosLine = 150; 
    
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", svgHeight);
    svg.setAttribute("viewBox", `0 0 ${svgWidth} ${svgHeight}`);
    
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", xPosLine);
    line.setAttribute("y1", startY);
    line.setAttribute("x2", xPosLine);
    line.setAttribute("y2", startY + ((ostiaData.length - 1) * nodeGap));
    line.setAttribute("class", "line-path");
    svg.appendChild(line);

    ostiaData.forEach((stop, index) => {
        const yPos = startY + (index * nodeGap);
        
        let fillColor = "#3498db"; 
        if (stop.tipo === "libero") fillColor = "#2ecc71"; 
        if (stop.tipo === "cancello") fillColor = "#e67e22"; 
        
        // Sovrascrive il colore se chiuso o sequestrato
        if (stop.stato === "chiuso" || stop.stato === "sequestrato") fillColor = "#e74c3c";

        if (index > 0) {
            const distText = document.createElementNS(svgNS, "text");
            distText.setAttribute("x", xPosLine - 20);
            distText.setAttribute("y", yPos - (nodeGap / 2) + 4);
            distText.setAttribute("text-anchor", "end");
            distText.setAttribute("class", "distance-label");
            distText.textContent = `+ ${stop.distanza_m} m`;
            svg.appendChild(distText);
        }

        const circle = document.createElementNS(svgNS, "circle");
        circle.setAttribute("cx", xPosLine);
        circle.setAttribute("cy", yPos);
        circle.setAttribute("r", 7);
        circle.setAttribute("fill", fillColor);
        circle.setAttribute("stroke", "#ffffff");
        circle.setAttribute("stroke-width", "2");
        circle.style.filter = "drop-shadow(0px 0px 0px 2px #333333)";
        svg.appendChild(circle);

        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", xPosLine + 25);
        text.setAttribute("y", yPos + 4);
        text.setAttribute("class", "node-label");
        
        // Aggiunge la label di chiuso/sequestrato se applicabile
        if (stop.stato === "chiuso" || stop.stato === "sequestrato") {
            text.textContent = stop.nome;
            text.style.textDecoration = "line-through";
            text.style.fill = "#7f8c8d";
            
            const statusText = document.createElementNS(svgNS, "tspan");
            statusText.setAttribute("class", "status-label");
            statusText.setAttribute("dx", "10");
            statusText.textContent = `[${stop.note.toUpperCase()}]`;
            text.appendChild(statusText);
        } else {
            text.textContent = stop.nome;
            // Aggiunge note positive (nuove concessioni, subentri)
            if (stop.note) {
                const infoText = document.createElementNS(svgNS, "tspan");
                infoText.setAttribute("class", "info-label");
                infoText.setAttribute("dx", "10");
                infoText.textContent = `— ${stop.note}`;
                text.appendChild(infoText);
            }
        }
        
        const linkWrapper = document.createElementNS(svgNS, "a");
        linkWrapper.setAttribute("href", stop.link);
        linkWrapper.setAttribute("target", "_blank");
        linkWrapper.appendChild(text);
        
        svg.appendChild(linkWrapper);
    });

    container.appendChild(svg);
}
