# Copy to deploy/servers.local.conf (git ignores it) and fill it in.
# The values come from the TopHost panel, FTP section. Quote the passwords
# with single quotes: '...'.

# The HOST is the server's own name, not ftp.<domain>: TopHost's certificate
# names *.th.seeweb.it, so only that name can be verified. ftp.isotype.org and
# ftp.meetoo.it both point to it today; if TopHost moves a site and the
# connection fails, `dig +short ftp.meetoo.it` gives the new name.

# isotype.org - the development server: every commit goes here.
isotype_HOST='w-10.th.seeweb.it'
isotype_USER=''
isotype_PASS=''
# The folder that holds index.php, as the FTP client shows it after login:
# /htdocs on TopHost ("Cartella iniziale remota per la pubblicazione file").
isotype_ROOT='/htdocs'
# ftp (TLS when the server offers it) or sftp.
isotype_PROTOCOL='ftp'
# 'no' only if the connection still fails on the certificate: the connection
# stays encrypted, but nobody checks who answers.
isotype_TLS_VERIFY='yes'
# Extra paths never to upload here (a regular expression), '' for none.
isotype_EXCLUDE=''

# meetoo.it - the real site: code only when you run deploy.sh meetoo.
meetoo_HOST='w-10.th.seeweb.it'
meetoo_USER=''
meetoo_PASS=''
meetoo_ROOT='/htdocs'
meetoo_PROTOCOL='ftp'
meetoo_TLS_VERIFY='yes'
# isotype.org's own verification files for Bing and Google stay on isotype.org.
meetoo_EXCLUDE='^(BingSiteAuth\.xml|google6158f6cb1c405995\.html|enable_varnish)$'
