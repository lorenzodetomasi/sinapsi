# Copy to deploy/servers.local.conf (git ignores it) and fill it in.
# The values come from the TopHost panel, FTP section. Quote the passwords
# with single quotes: '...'.

# isotype.org - the development server: every commit goes here.
isotype_HOST='ftp.isotype.org'
isotype_USER=''
isotype_PASS=''
# The folder that holds index.php, as the FTP client shows it after login
# (often / or /www.isotype.org or /public_html).
isotype_ROOT='/'
# ftp (TLS when the server offers it) or sftp.
isotype_PROTOCOL='ftp'
# 'no' only if the connection fails on the certificate (a shared host's
# certificate does not name your domain).
isotype_TLS_VERIFY='yes'
# Extra paths never to upload here (a regular expression), '' for none.
isotype_EXCLUDE=''

# meetoo.it - the real site: code only when you run deploy.sh meetoo.
meetoo_HOST='ftp.meetoo.it'
meetoo_USER=''
meetoo_PASS=''
meetoo_ROOT='/'
meetoo_PROTOCOL='ftp'
meetoo_TLS_VERIFY='yes'
# isotype.org's own verification files for Bing and Google stay on isotype.org.
meetoo_EXCLUDE='^(BingSiteAuth\.xml|google6158f6cb1c405995\.html|enable_varnish)$'
